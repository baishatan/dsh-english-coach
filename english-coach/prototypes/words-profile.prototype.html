function listData(){
 const q=queryFor();const base=state.browse==='personal'?ownWords():words.filter(w=>listIds[state.browse].includes(w.id));
 const filtered=base.filter(w=>(!q.search||`${w.term} ${w.meaning}`.toLowerCase().includes(q.search.trim().toLowerCase()))&&(q.filter==='all'||(q.filter==='joined'?w.joined:q.filter==='unjoined'?!w.joined:w.status===q.filter)));
 const pages=Math.max(1,Math.ceil(filtered.length/q.size));q.page=Math.min(q.page,pages);
 return {base,filtered,pages,items:filtered.slice((q.page-1)*q.size,q.page*q.size)};
}
function updateURL(){
 const url=new URL(location.href);url.searchParams.set('variant',state.variant);url.searchParams.set('page',state.page);
 try{history.replaceState(null,'',url);}catch{/* Some file viewers disallow history; the standalone file still runs. */}
}
function focusAction(action){requestAnimationFrame(()=>document.querySelector(`[data-action="${action}"]`)?.focus());}
function navigate(change){
 if(profileDirty()){
  pendingNavigation=change;
  showDialog('leave-dialog',`<div class="dialog-title"><h2 id="leave-title">修改还没有保存</h2></div><p class="muted">离开会放弃刚才修改的个人目标。你也可以留在这里继续编辑。</p><div class="dialog-actions">${btn('放弃修改并离开','discard-leave')}${btn('继续编辑','keep-editing','primary','autofocus')}</div>`);
  return;
 }
 if(state.draft)state.draft=null;
 change();render();
}
function announce(text){clearTimeout(toastTimer);const el=$('#toast');el.textContent=text;el.classList.add('visible');toastTimer=setTimeout(()=>el.classList.remove('visible'),4300);}
function showDialog(id,html){lastFocus=document.activeElement;const dialog=$(`#${id}`);dialog.innerHTML=html;dialog.showModal();}
function closeDialog(id){$(`#${id}`).close();if(lastFocus?.isConnected)lastFocus.focus();}
function header(){
 $('#header').innerHTML=`<div class="brand"><span class="brand-mark">${icon('book')}</span>英语教练</div><nav class="app-nav" aria-label="英语教练">${[['today','今天'],['words','单词'],['plan','大纲'],['profile','个人']].map(([id,label])=>`<button type="button" data-action="page" data-page="${id}" ${state.page===id?'aria-current="page"':''}>${label}</button>`).join('')}</nav><div class="header-meta"><span class="dot"></span>为自己的节奏而学</div>`;
}
function PrototypeSwitcher(){
 // This switcher exists only in the excluded prototype artifact, never the production client bundle.
 if(document.documentElement.dataset.prototype!=='true')return '';
 return `<button type="button" data-action="prev-variant" aria-label="上一个方案">${icon('left')}</button><div class="variant-label"><small>比较设计 · ${['A','B','C'].indexOf(state.variant)+1} / 3</small><span class="variant-name">${state.variant}　${names[state.variant]}</span></div><button type="button" data-action="next-variant" aria-label="下一个方案">${icon('right')}</button><span class="control-divider"></span><button type="button" data-action="state">状态<span class="sr-only">与演示场景</span></button><button type="button" data-action="reset" title="还原全部示例数据">重置</button>`;
}
function studyCard(){
 const round=state.round;const word=roundWord();
 if(roundDone())return `<section class="study-card"><div class="empty"><span class="check-mark">${icon('check')}</span><h2>这一轮完成了</h2><p class="muted" style="margin-top:10px">练习 ${round.items.length} 项，答对 ${round.correct} 项。</p><p class="hint" style="margin-top:5px">${dueWords().length?`还有 ${dueWords().length} 项到期词，下一轮继续优先复习。`:'到期复习已完成，可以继续学习新词。'}</p>${btn(dueWords().length?'再复习一轮':'继续学习新词','new-round','primary')}<div style="margin-top:12px">${btn('先休息一下，看看词汇','finish-browse','text')}</div></div></section>`;
 if(!word)return `<section class="study-card"><div class="empty"><span class="check-mark">${icon('check')}</span><h2>这次没有待练习的词</h2><p class="hint">${state.scenario==='unavailable'?'剩余词条暂不可练，不会自动改用其他来源。':state.activeList==='none'?'尚未指定新词来源，可以选一个主题词库。':'当前示例词条全部已加入；已加入不等于已掌握。'}</p>${btn('选择其他词库','choose-source','primary')}<div style="margin-top:12px">${btn('按画像补词','profile-supplement','text')}</div></div></section>`;
 const picked=round.picked;const correctIndex=word.id%4;
 const distractors=['分配；拨出','推迟；延期','保存；储存','忽略；不理会'].filter(v=>v!==word.meaning).slice(0,3);distractors.splice(correctIndex,0,word.meaning);
 return `<section class="study-card" aria-label="本轮学习"><div class="study-top"><span>${word.fresh?'初次学习':'到期复习'}</span><span>本轮 <strong>${round.index+1}</strong> / ${round.items.length} 项</span></div><div class="progress-track" role="progressbar" aria-label="本轮完成进度" aria-valuemin="0" aria-valuemax="${round.items.length}" aria-valuenow="${round.index+(picked!==null?1:0)}"><span style="width:${(round.index+(picked!==null?1:0))/round.items.length*100}%"></span></div><div class="term-block"><div class="term-row"><h2 class="term" lang="en">${esc(word.term)}</h2>${audio(word.term)}</div><div class="pronunciation" lang="en">${esc(word.ipa || 'English expression')}</div></div><p class="question">选出正确的中文释义</p><div class="choices">${distractors.map((choice,i)=>{const result=picked===null?'':i===correctIndex?'correct':i===picked?'wrong':'dim';return `<button type="button" class="choice" data-action="answer" data-index="${i}" ${picked!==null?'disabled':''} data-result="${result}"><span class="choice-key">${i+1}</span><span>${esc(choice)}</span>${result==='correct'?'<span class="choice-status" aria-label="正确答案">✓</span>':result==='wrong'?'<span class="choice-status" aria-label="回答错误">×</span>':''}</button>`;}).join('')}</div>${picked!==null?`<div class="feedback" role="status"><div class="feedback-title ${picked===correctIndex?'':'wrong'}">${picked===correctIndex?'答对了':'再记一次'}：${esc(word.meaning)}</div><p class="example" lang="en">${esc(word.example)}</p><p class="hint">${esc(word.note)}</p><div class="feedback-action"><span class="hint">${word.fresh?'首次作答会进入后续复习。':'复习按间隔推进，不会一次答对就标记掌握。'}</span>${btn(round.index+1===round.items.length?'完成本轮':'下一项','next-word','primary')}</div></div>`:`<div class="study-bottom"><span>先复习旧词，再安排新词</span><span class="keyboard-hint"><kbd>1</kbd>–<kbd>4</kbd> 选择</span></div>`}</section>`;
}
function sourceAside(){return `<aside class="study-aside"><h3>按你的节奏</h3><div class="setting-line"><span class="label">全部待复习</span><b>${dueWords().length} 项</b></div><div class="setting-line"><label class="label" for="batch-size">每批学习</label><div class="batch-control"><input id="batch-size" type="number" min="3" max="30" value="${state.batchSize}" data-change="batch" aria-label="每批学习词数"><span class="small muted">项</span></div></div><div class="setting-source"><div class="label">新词优先来自</div><div class="row between"><b>${listNames[state.activeList]}${state.activeList==='cet6'?'词库':''}</b>${btn('更换','choose-source','text small')}</div><p class="hint" style="margin-top:10px">选库只影响下一批新词。<br>所有来源的到期词都优先复习。</p></div><p class="hint">一批学完还能继续，没有每日上限。</p></aside>`;}
function sourceTabs(){return `<div class="source-tabs" role="group" aria-label="浏览词库">${['cet4','cet6','ielts'].map(id=>`<button type="button" data-action="browse-source" data-source="${id}" aria-pressed="${state.browse===id}">${listNames[id]}${id==='cet6'?'（含四级基础）':''}</button>`).join('')}</div>`;}
function sourceSummary(){
 if(state.browse==='personal')return '';
 const all=words.filter(w=>listIds[state.browse].includes(w.id));const current=state.activeList===state.browse;
 return `<div class="source-summary"><div><strong>${listNames[state.browse]}学习参考词库</strong><p class="hint">此处只浏览，不会加入个人学习。</p><p class="hint">示例目录 ${all.length} 项，可练 ${all.filter(w=>w.ready).length} 项</p></div>${current?`<span class="pill accent">${icon('check','small')} 当前词库</span>`:btn('设为当前词库','set-source','','data-source="'+state.browse+'"')}</div>`;
}
function listMarkup(){
 const q=queryFor();const data=listData();const personal=state.browse==='personal';
 const filters=personal?[['all','全部状态'],['learning','在学'],['mastered','已掌握']]:[['all','全部状态'],['joined','已加入'],['unjoined','未加入']];
 return `${sourceSummary()}<div class="list-tools"><label class="search-box">${icon('search')}<span class="sr-only">搜索英文或中文释义</span><input type="search" data-input="search" placeholder="搜索英文或中文释义" value="${esc(q.search)}" autocomplete="off"></label><select class="filter-select" data-change="filter" aria-label="词汇状态筛选">${filters.map(([value,label])=>`<option value="${value}" ${q.filter===value?'selected':''}>${label}</option>`).join('')}</select></div><div class="list-caption"><span>共 ${data.filtered.length} 项${q.search||q.filter!=='all'?'符合条件':''}</span><span>按字母排序</span></div><div class="word-list" aria-label="${personal?'我的词汇':'主题词库'}列表">${data.items.length?data.items.map(w=>`<div class="word-row ${state.variant==='B'&&state.selectedWord===w.id&&state.bPane==='detail'?'selected':''}"><button type="button" class="word-main" data-action="word-detail" data-id="${w.id}" aria-label="查看 ${esc(w.term)} 详情"><span class="list-term" lang="en">${esc(w.term)}</span><span class="word-meaning">${esc(w.meaning)}</span><span class="word-state ${personal&&w.due?'due':''}">${personal?(w.status==='mastered'?'已掌握':w.due?'待复习':w.fresh?'未首次作答':'在学'):!w.ready?'暂不可练':w.joined?'已加入':'未加入'}</span></button>${audio(w.term)}</div>`).join(''):`<div class="empty"><h3>没有找到匹配的词</h3><p class="hint">试试更短的英文或中文释义，也可以清除筛选。</p>${btn('清除搜索与筛选','clear-search','text')}</div>`}</div><div class="pagination"><label>每页 <select data-change="page-size" aria-label="每页条数"><option value="50" ${q.size===50?'selected':''}>50 项</option><option value="20" ${q.size===20?'selected':''}>20 项</option></select></label><div class="row">${btn('上一页','previous-page','quiet small',q.page===1?'disabled':'')}<span>${q.page} / ${data.pages} 页</span>${btn('下一页','next-page','quiet small',q.page===data.pages?'disabled':'')}</div></div>${!personal?`<details class="source-footnote"><summary>词库来源与说明</summary><p>正式产品使用开源学习参考词库，不是官方考试全集。这里仅包含合成演示条目，数字不代表真实词库总量。已加入只表示进入个人学习，不代表已掌握。</p></details>`:''}`;
}
function detailMarkup(id){
 const w=words.find(w=>w.id===id) || words[9];
 return `<div class="row between"><span class="pill">${w.term.includes(' ')?'表达':'单词'}</span>${audio(w.term)}</div><h2 class="detail-term" id="detail-title" lang="en">${esc(w.term)}</h2>${w.ipa?`<div class="pronunciation">${esc(w.ipa)}</div>`:''}<p class="detail-meaning">${esc(w.meaning)}</p><div class="definition-example"><p class="example" lang="en">${esc(w.example)}</p><p class="hint" style="margin-top:12px">${esc(w.note)}</p></div><dl class="detail-facts"><dt>学习状态</dt><dd>${!w.joined?'未加入':w.status==='mastered'?'已掌握':w.due?'在学，今天待复习':w.fresh?'已加入，未首次作答':'在学'}</dd><dt>所属词库</dt><dd>${Object.entries(listIds).filter(([,ids])=>ids.includes(w.id)).map(([id])=>listNames[id]).join('、')}</dd><dt>练习状态</dt><dd>${w.ready?'已准备基础练习':'暂不可练：释义待复核'}</dd></dl><div class="detail-tip">${w.joined?'同一个词在不同词库共享学习进度。换词库不会重新开始。':'浏览不会加入学习；后续补词时，才会从当前词库选择合适的条目。'}</div>`;
}
function browseSection(title,withTabs=true){return `<section class="panel browse-expanded" id="browse-panel"><div class="section-head"><h2>${title}</h2>${state.variant==='A'?btn('收起','close-browse','quiet small'):''}</div>${state.browse!=='personal'&&withTabs?sourceTabs():''}${listMarkup()}</section>`;}
function VariantA(){
 if(state.page==='profile')return profileA();
 return `<div class="page-head"><div><h1>单词</h1><p>先把熟悉的词记牢，再慢慢积累。</p></div>${btn('学习安排','round-settings','quiet small','style="font-weight:400"')}</div><div class="a-focus"><div>${studyCard()}</div>${sourceAside()}</div><div class="browse-gates"><button type="button" class="gate" data-action="open-personal" aria-expanded="${state.browseOpen==='personal'}"><span class="gate-icon">${icon('cards')}</span><span><strong>我的词汇</strong><small>${ownWords().length} 项已加入，随时查找</small></span><span class="chevron">${icon(state.browseOpen==='personal'?'down':'right','small')}</span></button><button type="button" class="gate" data-action="open-themed" aria-expanded="${state.browseOpen==='themed'}"><span class="gate-icon">${icon('layers')}</span><span><strong>主题词库</strong><small>浏览四级、六级和雅思词汇</small></span><span class="chevron">${icon(state.browseOpen==='themed'?'down':'right','small')}</span></button></div>${state.browseOpen?browseSection(state.browseOpen==='personal'?'我的词汇':'主题词库'):''}`;
}
function workspaceNav(){return `<aside class="workspace-nav" aria-label="词汇来源"><div class="label">我的学习</div><button type="button" data-action="browse-source" data-source="personal" aria-pressed="${state.browse==='personal'}">${icon('cards','small')}我的词汇</button><div class="label nav-separator">主题词库</div>${['cet4','cet6','ielts'].map(id=>`<button type="button" data-action="browse-source" data-source="${id}" aria-pressed="${state.browse===id}">${listNames[id]}${state.activeList===id?'<span aria-label="当前词库">•</span>':''}</button>`).join('')}</aside>`;}
function VariantB(){
 if(state.page==='profile')return profileB();
 return `<div class="page-head"><div><h1>单词</h1><p>找到一个词，顺手弄懂它。</p></div>${btn('新词来源：'+listNames[state.activeList],'choose-source','quiet small')}</div><div class="review-strip"><div><strong>${dueWords().length ? `全部待复习 ${dueWords().length} 项` : '到期复习已完成'}</strong><p>${state.round.items.length ? `本轮 ${state.round.items.length} 项，查词不会打断进度。` : '选择一个新词来源，继续积累。'}</p></div>${btn(state.bPane==='study'&&state.mobileDetail?'正在练习':'继续本轮学习','b-study','primary',state.bPane==='study'&&state.mobileDetail?'disabled':'')}</div><div class="workspace" data-mobile-detail="${state.mobileDetail}">${workspaceNav()}<section class="workspace-list" aria-label="查找词汇"><h2>${state.browse==='personal'?'我的词汇':listNames[state.browse]+'词库'}${state.browse==='cet6'?'<span class="small muted">　含四级基础</span>':''}</h2>${listMarkup()}</section><section class="workspace-detail" aria-label="词汇详情与本轮学习"><div class="mobile-back">${btn(icon('left','small')+'返回词表','b-back','text')}</div><div class="pane-title"><span>${state.bPane==='study'?'本轮学习':'词汇详情'}</span>${state.bPane==='study'?btn('返回词义','b-detail','text small'):''}</div>${state.bPane==='study'?studyCard():detailMarkup(state.selectedWord)}</section></div>`;
}
function VariantC(){
 if(state.page==='profile')return profileC();
 let inner='';
 if(state.cView==='home')inner=`<div class="page-head"><div><h1>单词</h1><p>今天也从一小轮开始。</p></div></div><section class="c-learn"><h2>先复习，再学新词</h2><p>${dueWords().length ? `${dueWords().length} 项到期词，分成小轮慢慢完成。` : '到期复习已完成，可以继续积累新词。'}</p>${btn(`继续本轮学习${icon('play','small')}`,'c-study','primary')}<div class="hint">每批 ${state.batchSize} 项，不设每日上限</div></section><div class="c-group"><button type="button" class="menu-row" data-action="open-personal">${icon('cards')}<span><strong>我的词汇</strong><small>${ownWords().length} 项已加入，可以搜索与查看</small></span>${icon('right','small')}</button><button type="button" class="menu-row" data-action="open-themed">${icon('layers')}<span><strong>主题词库</strong><small>四级、六级（含四级基础）、雅思</small></span>${icon('right','small')}</button></div><div class="c-foot"><span>新词优先来自：${listNames[state.activeList]}</span>${btn('调整学习安排','round-settings','text small')}</div>`;
 else if(state.cView==='study')inner=`${backHeading('本轮学习','c-home')}${studyCard()}<div class="c-foot"><span>到期旧词优先，本轮题目不会随切库改变。</span>${btn('学习安排','round-settings','text small')}</div>`;
 else if(state.cView==='word')inner=`${backHeading('词汇详情','c-list')}<section class="panel">${detailMarkup(state.selectedWord)}</section>`;
 else inner=`${backHeading(state.browse==='personal'?'我的词汇':'主题词库','c-home')}<section class="panel">${state.browse!=='personal'?sourceTabs():''}${listMarkup()}</section>`;
 return `<div class="compact-page">${inner}</div>`;
}
function backHeading(title,action){return `<div class="back-heading">${btn(icon('left'),action,'quiet','aria-label="返回"')}<h1>${title}</h1></div>`;}
function goalSummary(compact=false){
 const p=state.profile;const interests=p.interests.split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
 return `<section class="panel goal-summary"><div class="section-head"><h2>个人目标</h2>${btn(icon('edit','small')+'编辑','edit-goal','text small')}</div><p class="goal-phrase">${esc(p.note||'为自己设定一个具体目标。')}</p><div class="goal-facts"><div class="goal-fact"><span>学习用途</span><b>${esc(p.purpose)}</b></div><div class="goal-fact"><span>每天投入</span><b>${p.minutes} 分钟</b></div><div class="goal-fact"><span>目标档位</span><b>${esc(p.target)}</b></div></div><div class="interests"><span class="muted">兴趣</span>${interests.slice(0,compact?2:3).map(v=>`<span class="interest">${esc(v)}</span>`).join('')}${interests.length>(compact?2:3)?`<details><summary>查看全部 ${interests.length} 项</summary><p>${interests.map(esc).join('、')}</p></details>`:''}${!interests.length?'<span class="muted">暂未填写</span>':''}</div></section>`;
}
function levelPair(){return `<div class="level-pair"><div><span class="label">当前水平估计</span><b>中级</b></div>${icon('arrow')}<div><span class="label">目标档位</span><b>${esc(state.profile.target)}</b></div></div>`;}
function metrics(){return `<div class="metric-line"><div><b>12<span class="sr-only">天</span></b><span>完成课程天数</span></div><div><b>4<span class="sr-only">天</span></b><span>连续学习天数</span></div><div><b>${words.filter(w=>w.status==='mastered').length}<span class="sr-only">项</span></b><span>已掌握词汇</span></div></div>`;}
function curve(){return `<section class="curve-wrap"><div class="section-head"><h2>水平变化</h2><span class="small muted">最近 3 次测评</span></div><svg viewBox="0 0 530 180" role="img" aria-label="10月2日初级，10月12日中级，10月22日中级。水平估计，不是考试分数。"><path d="M68 35H503M68 85H503M68 135H503" stroke="#e5eaf1" stroke-width="1" fill="none"/><text x="8" y="39">中高级</text><text x="20" y="89">中级</text><text x="20" y="139">初级</text><path d="M88 135L286 85L484 85" stroke="#345bc0" stroke-width="2.5" fill="none"/><g fill="#fff" stroke="#345bc0" stroke-width="2"><circle cx="88" cy="135" r="4"/><circle cx="286" cy="85" r="4"/><circle cx="484" cy="85" r="4"/></g><text x="66" y="168">10月2日</text><text x="260" y="168">10月12日</text><text x="458" y="168">10月22日</text></svg><p class="hint">测评给出水平估计，不与考试分数等价。</p></section>`;}
function records(){return `<div class="record-list"><div class="record-row"><time>10月22日</time><b>中级</b><span class="muted small">阅读更稳定</span></div><div class="record-row"><time>10月12日</time><b>中级</b><span class="muted small">建议加强听力</span></div><div class="record-row"><time>10月2日</time><b>初级</b><span class="muted small">首次测评</span></div></div>`;}
function profileA(){return `<div class="page-head"><div><h1>个人</h1><p>知道自己为什么学，也看见走过的路。</p></div></div><div class="profile-a"><div>${goalSummary()}<section class="progress-summary"><div class="section-head"><h2>一点一点，已经积累了这些</h2>${btn(state.records?'收起记录':'查看记录','toggle-records','text small')}</div>${metrics()}</section>${state.records?curve()+`<section class="panel" style="margin-top:20px"><h2>测评记录</h2>${records()}</section>`:''}</div><aside class="level-box"><h2>现在与目标</h2>${levelPair()}<p>最近测评于 10月22日。<br>这是学习参考，不是考试分数。</p><div class="focus-suggestion"><h3>下一步，多练听力</h3><p>最近测评中，听力丢分较多。可以从听懂工作场景中的短对话开始。</p>${btn('查看测评记录','show-records','text small')}</div></aside></div>`;}
function profileB(){return `<div class="page-head"><div><h1>个人</h1><p>先回顾学习变化，再调整方向。</p></div></div><div class="profile-b"><div><div class="row between"><div><span class="label">当前水平估计</span><h2 style="font-size:27px;margin-top:5px">中级</h2></div><span class="small muted">最近测评 10月22日</span></div>${curve()}<section class="progress-summary"><h2>学习积累</h2>${metrics()}</section><section style="margin-top:24px"><div class="section-head"><h2>测评记录</h2>${btn(state.records?'收起':'展开','toggle-records','text small')}</div>${state.records?records():'<p class="hint">3 次测评记录。展开可查看每次估计与建议。</p>'}</section></div><aside>${goalSummary(true)}<div class="focus-suggestion"><h3>值得多练：听力</h3><p>比起同时追踪很多数字，先照顾最近测评中最需要练习的部分。</p></div></aside></div>`;}
function profileC(){
 if(state.profileView==='goal')return `<div class="compact-page">${backHeading('个人目标','profile-home')}${goalSummary()}</div>`;
 if(state.profileView==='records')return `<div class="compact-page">${backHeading('学习记录','profile-home')}${curve()}<section class="panel" style="margin-top:20px"><h2>测评记录</h2>${records()}</section></div>`;
 return `<div class="compact-page"><div class="page-head"><div><h1>个人</h1><p>把注意力留给真正重要的事。</p></div></div><section class="profile-c-summary">${levelPair()}${metrics()}<p class="hint">最近测评 10月22日，估计仅作学习参考。</p></section><div class="c-group"><button type="button" class="menu-row" data-action="profile-goal">${icon('profile')}<span><strong>个人目标</strong><small>${esc(state.profile.purpose)}，每天 ${state.profile.minutes} 分钟</small></span>${icon('right','small')}</button><button type="button" class="menu-row" data-action="profile-records">${icon('chart')}<span><strong>学习记录</strong><small>水平变化与最近 3 次测评</small></span>${icon('right','small')}</button></div><p class="hint" style="margin:22px 4px">目标可以慢慢调整。修改目标不会重置已有学习进度。</p></div>`;
}
function editor(){
 const d=state.draft;
 return `<div class="editor">${backHeading('编辑个人目标','cancel-edit')}<form id="goal-form" class="panel"><p class="muted">让后续课程更贴近你。已有课程和学习进度不变。</p><div class="form-grid"><div class="field"><label for="purpose">主要用英语做什么</label><select id="purpose" name="purpose" data-draft="purpose">${['工作交流','学习研究','旅行交流','影音阅读','考试准备','其他'].map(v=>`<option ${v===d.purpose?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="minutes">每天愿意投入多少分钟</label><input type="number" id="minutes" name="minutes" data-draft="minutes" min="5" max="180" required value="${d.minutes}"><span class="hint">用来安排课程，不是每日学习上限。</span></div><div class="field full"><label for="target">希望达到的档位</label><select id="target" name="target" data-draft="target">${['暂未设定','入门','初级','中级','中高级','高级','精通'].map(v=>`<option ${v===d.target?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label for="goal-note">具体想做到什么</label><textarea id="goal-note" name="note" data-draft="note" placeholder="例如：在工作讨论中清楚地表达想法">${esc(d.note)}</textarea></div><div class="field full"><label for="interests">喜欢哪些话题</label><input id="interests" name="interests" data-draft="interests" value="${esc(d.interests)}" placeholder="例如：科技、旅行、设计"><span class="hint">用顿号或逗号分隔，最多 12 项；保存时一并收录。</span></div></div><div id="form-error" ${state.saveError?'':'hidden'} class="form-error" role="alert">保存未完成（模拟失败），输入已保留。取消下方失败模拟后可以重试。</div><div class="form-actions"><span class="draft-indicator" id="draft-indicator">${profileDirty()?'有未保存的修改':'还没有修改'}</span>${btn('取消','cancel-edit')}<button type="submit" class="button primary">保存目标</button></div><div class="form-prototype-note"><label><input type="checkbox" data-change="fail-save" ${state.failSave?'checked':''}>原型演示：模拟保存失败，检查输入是否保留</label></div></form></div>`;
}
function contextPage(){return `<section class="context-only">${icon(state.page==='today'?'book':'layers')}<h1>${state.page==='today'?'今天':'大纲'}沿用现有设计</h1><p>这里保留原有导航上下文，没有重新设计这页。<br>本次只比较单词页和个人页，不会连接真实课程。</p><div class="row">${btn('查看单词页','page','primary','data-page="words"')}${btn('查看个人页','page','','data-page="profile"')}</div></section>`;}
function visibleState(){
 return {prototype:true,variant:state.variant,page:state.page,view:{browseOpen:state.browseOpen,browse:state.browse,cView:state.cView,profileView:state.profileView,bPane:state.bPane,mobileDetail:state.mobileDetail},activeWordList:state.activeList,batchSize:state.batchSize,dueCount:dueWords().length,personalCount:ownWords().length,masteredCount:words.filter(w=>w.status==='mastered').length,round:state.round?{sourceAtStart:state.round.source,configuredSizeAtStart:state.round.size,itemIds:state.round.items.map(w=>w.id),index:state.round.index,picked:state.round.picked,correct:state.round.correct}:null,queries:state.queries,selectedWord:state.selectedWord,profile:state.profile,draft:state.draft,dirty:!!profileDirty(),saveError:state.saveError,failSave:state.failSave,answers:state.answers,scenario:state.scenario,persistence:'none',hostCalls:0};
}
function renderState(){
 $('#state-summary').textContent=`示例状态：当前词库 ${listNames[state.activeList]}；本轮开始时偏好 ${state.round?.source?listNames[state.round.source]:'无'}；数据仅在内存中。`;
 const pre=$('#state-output');if(pre)pre.textContent=JSON.stringify(visibleState(),null,2);
}
function render(options={}){
 const scroll=$('.word-list')?.scrollTop||0;
 const active=document.activeElement;const inputFocus=active?.matches('[data-input="search"]');
 const start=inputFocus?active.selectionStart:null,end=inputFocus?active.selectionEnd:null;
 header();document.documentElement.dataset.variant=state.variant;
 $('#app').innerHTML=state.draft?editor():!['words','profile'].includes(state.page)?contextPage():({A:VariantA,B:VariantB,C:VariantC}[state.variant])();
 $('#switcher').innerHTML=PrototypeSwitcher();renderState();updateURL();
 if(options.keepListScroll&&$('.word-list'))$('.word-list').scrollTop=scroll;
 if(inputFocus&&$('[data-input="search"]')){const input=$('[data-input="search"]');input.focus({preventScroll:true});if(start!==null)input.setSelectionRange(start,end);}
}
function changeVariant(delta){navigate(()=>{const variants=['A','B','C'];state.variant=variants[(variants.indexOf(state.variant)+delta+3)%3];console.info('Prototype variant state',visibleState());});}
function openSource(){
 sourceDraft=state.activeList;
 showDialog('source-dialog',`<div class="dialog-title"><h2 id="source-title">选择新词来源</h2><button type="button" class="icon-button" data-action="close-source" aria-label="关闭">${icon('close')}</button></div><p class="muted small">下一批生效。不会把整库加入学习，也不会重置已有进度。</p>${['cet4','cet6','ielts','none'].map(id=>`<button type="button" class="source-choice" data-action="source-option" data-source="${id}" aria-pressed="${state.activeList===id}"><strong>${id==='none'?'不指定词库':listNames[id]+'学习参考词库'}</strong><small>${id==='cet6'?'包含四级基础词汇':id==='none'?'后续按画像与课程补充新词':id==='ielts'?'优先参考雅思方向的词汇':'优先巩固基础词汇'}</small></button>`).join('')}<div class="dialog-actions">${btn('取消','close-source')}${btn('保存新词来源','save-source','primary')}</div>`);
}
function openSettings(){showDialog('source-dialog',`<div class="dialog-title"><h2 id="source-title">学习安排</h2><button type="button" class="icon-button" data-action="close-source" aria-label="关闭">${icon('close')}</button></div><p class="muted">本轮题目保持不变，调整从下一批生效。</p><div class="field" style="margin-top:24px"><label for="dialog-batch">每批学习词数</label><input type="number" min="3" max="30" id="dialog-batch" value="${state.batchSize}"><span class="hint">3–30 项，一批学完还能继续；不是每日额度。</span></div><div class="setting-line" style="margin-top:18px"><span class="label">新词优先来自</span><strong>${listNames[state.activeList]}</strong>${btn('更换','settings-source','text small')}</div><div class="dialog-actions">${btn('取消','close-source')}${btn('保存安排','save-batch','primary')}</div>`);}
function showState(){
 showDialog('state-dialog',`<div class="dialog-title"><h2 id="state-title">原型状态与场景</h2><button type="button" class="icon-button" data-action="close-state" aria-label="关闭状态">${icon('close')}</button></div><p class="small muted">全部是内存示例。切换方案保留状态，重置或刷新会还原。场景切换会重置本轮，不连接真实数据。</p><div class="scenario-buttons">${btn('常规：30 项待复习','scenario','','data-scenario="normal"')}${btn('无到期词，有新词','scenario','','data-scenario="fresh"')}${btn('全部已加入','scenario','','data-scenario="joined"')}${btn('剩余暂不可练','scenario','','data-scenario="unavailable"')}</div><pre id="state-output"></pre>`);renderState();
}
function setScenario(scenario){
 words.forEach((w,i)=>{w.joined=i<52;w.status=i<14?'mastered':'learning';w.due=i>=14&&i<44;w.fresh=i>=44&&i<52;w.ready=i!==59;});
 state.scenario=scenario;state.answers=[];
 if(scenario==='fresh')words.forEach(w=>w.due=false);
 if(['joined','unavailable'].includes(scenario)){words.forEach(w=>{w.due=false;w.fresh=false;w.joined=scenario==='joined'||w.id!==59;});state.activeList='cet6';}
 buildRound();render();announce('已切换示例场景，不影响真实学习数据。');
}
function answer(index){
 const word=roundWord();if(!word||roundAnswered())return;
 state.round.picked=index;const correct=index===word.id%4;if(correct)state.round.correct++;
 const actual=words.find(w=>w.id===word.id);actual.due=false;actual.fresh=false;
 state.answers.push({id:word.id,term:word.term,correct});render({keepListScroll:true});focusAction('next-word');
}
function newRound(){
 const fresh=words.some(w=>w.joined&&w.fresh);
 if(!dueWords().length&&!fresh&&state.activeList!=='none'){
  const available=words.filter(w=>listIds[state.activeList].includes(w.id)&&!w.joined&&w.ready);
  available.slice(0,state.batchSize).forEach(w=>{w.joined=true;w.fresh=true;});
 }
 buildRound();render();
}
function saveGoal(){
 const form=$('#goal-form');if(!form.reportValidity())return;
 const interests=state.draft.interests.split(/[、,，]/).map(v=>v.trim()).filter(Boolean);
 if(interests.length>12){const err=$('#form-error');err.hidden=false;err.textContent='兴趣最多 12 项。请减少后保存，其他输入已保留。';return;}
 if(state.failSave){state.saveError=true;render();return;}
 state.profile={...state.draft,minutes:Number(state.draft.minutes),interests:[...new Set(interests)].join('、')};
 state.draft=null;state.dirty=false;state.saveError=false;render();announce('个人目标已保存到本次原型，刷新后还原。');focusAction('edit-goal');
}
document.addEventListener('submit',event=>{if(event.target.id==='goal-form'){event.preventDefault();saveGoal();}});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.dataset.input==='search'){const q=queryFor();q.search=el.value;q.page=1;render();}
 if(el.dataset.draft){state.draft[el.dataset.draft]=el.value;state.dirty=!!profileDirty();state.saveError=false;$('#form-error').hidden=true;$('#draft-indicator').textContent=state.dirty?'有未保存的修改':'还没有修改';renderState();}
});
document.addEventListener('change',event=>{
 const el=event.target,action=el.dataset.change;
 if(action==='filter'){queryFor().filter=el.value;queryFor().page=1;render();}
 if(action==='page-size'){queryFor().size=Number(el.value);queryFor().page=1;render();}
 if(action==='batch'){if(el.reportValidity()&&Number(el.value)>=3&&Number(el.value)<=30){state.batchSize=Number(el.value);renderState();announce('每批词数已调整，下一批生效。当前题目不变。');}}
 if(action==='fail-save'){state.failSave=el.checked;renderState();}
 if(el.dataset.draft){state.draft[el.dataset.draft]=el.value;state.dirty=!!profileDirty();$('#draft-indicator').textContent=state.dirty?'有未保存的修改':'还没有修改';renderState();}
});
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target)return;
 event.preventDefault();const action=target.dataset.action;
 if(action==='page')navigate(()=>{state.page=target.dataset.page;state.cView='home';state.profileView='home';window.scrollTo(0,0);});
 else if(action==='prev-variant')changeVariant(-1);
 else if(action==='next-variant')changeVariant(1);
 else if(action==='sound')announce(`朗读「${target.dataset.term}」：这里只演示操作反馈，不调用语音或外发文本。`);
 else if(action==='answer')answer(Number(target.dataset.index));
 else if(action==='next-word'){state.round.index++;state.round.picked=null;render({keepListScroll:true});focusAction(roundDone()?'new-round':'answer');}
 else if(action==='new-round')newRound();
 else if(action==='choose-source')openSource();
 else if(action==='round-settings')openSettings();
 else if(action==='close-source')closeDialog('source-dialog');
 else if(action==='source-option'){sourceDraft=target.dataset.source;$$('.source-choice').forEach(b=>b.setAttribute('aria-pressed',b.dataset.source===sourceDraft));}
 else if(action==='save-source'){state.activeList=sourceDraft;closeDialog('source-dialog');render({keepListScroll:true});announce('新词来源已保存，下一批生效。本轮题目与已有进度不变。');}
 else if(action==='save-batch'){const input=$('#dialog-batch');if(input.reportValidity()&&Number(input.value)>=3&&Number(input.value)<=30){state.batchSize=Number(input.value);closeDialog('source-dialog');render({keepListScroll:true});announce('学习安排已保存，下一批生效。');}}
 else if(action==='settings-source'){closeDialog('source-dialog');openSource();}
 else if(action==='set-source'){state.activeList=target.dataset.source;render({keepListScroll:true});announce('已设为当前词库，下一批新词生效；没有加入整库。');}
 else if(action==='open-personal'||action==='open-themed'||action==='finish-browse'){
  const personal=action!=='open-themed';state.browse=personal?'personal':state.activeList==='none'?'cet6':state.activeList;state.browseOpen=personal?'personal':'themed';state.cView='list';state.mobileDetail=false;render();if(state.variant==='A')$('#browse-panel')?.scrollIntoView({behavior:'auto',block:'start'});
 }
 else if(action==='close-browse'){state.browseOpen=null;render();focusAction('open-personal');}
 else if(action==='browse-source'){state.browse=target.dataset.source;state.mobileDetail=false;render();}
 else if(action==='clear-search'){queryFor().search='';queryFor().filter='all';queryFor().page=1;render();}
 else if(action==='previous-page'||action==='next-page'){queryFor().page+=action==='next-page'?1:-1;render();}
 else if(action==='word-detail'){
  state.selectedWord=Number(target.dataset.id);
  if(state.variant==='B'){state.bPane='detail';state.mobileDetail=true;render({keepListScroll:true});}
  else if(state.variant==='C'){state.cView='word';render();window.scrollTo(0,0);}
  else showDialog('detail-dialog',`<div class="dialog-title"><span class="small muted">词汇详情</span><button type="button" class="icon-button" data-action="close-detail" aria-label="关闭词汇详情">${icon('close')}</button></div>${detailMarkup(state.selectedWord)}`);
 }
 else if(action==='close-detail')closeDialog('detail-dialog');
 else if(action==='b-study'){state.bPane='study';state.mobileDetail=true;render({keepListScroll:true});}
 else if(action==='b-detail'){state.bPane='detail';render({keepListScroll:true});}
 else if(action==='b-back'){state.mobileDetail=false;render({keepListScroll:true});}
 else if(action==='c-study'){state.cView='study';render();}
 else if(action==='c-home'){state.cView='home';render();}
 else if(action==='c-list'){state.cView='list';render();}
 else if(action==='edit-goal'){state.draft={...state.profile};state.dirty=false;state.saveError=false;render();requestAnimationFrame(()=>$('#purpose')?.focus());}
 else if(action==='cancel-edit'){state.draft=null;state.dirty=false;state.saveError=false;render();focusAction('edit-goal');announce('已取消，保存过的目标没有改变。');}
 else if(action==='discard-leave'){closeDialog('leave-dialog');state.draft=null;state.dirty=false;state.saveError=false;const proceed=pendingNavigation;pendingNavigation=null;proceed?.();render();}
 else if(action==='keep-editing'){closeDialog('leave-dialog');pendingNavigation=null;$('#goal-note')?.focus();}
 else if(action==='toggle-records'){state.records=!state.records;render();}
 else if(action==='show-records'){state.records=true;render();$('.curve-wrap')?.scrollIntoView({block:'center'});}
 else if(action==='profile-goal'){state.profileView='goal';render();}
 else if(action==='profile-records'){state.profileView='records';render();}
 else if(action==='profile-home'){state.profileView='home';render();}
 else if(action==='profile-supplement')announce('正式产品会请求按画像生成新词。本原型不调用模型，也不会自动更换词库。');
 else if(action==='state')showState();
 else if(action==='close-state')closeDialog('state-dialog');
 else if(action==='scenario'){const scenario=target.dataset.scenario;closeDialog('state-dialog');navigate(()=>setScenario(scenario));}
 else if(action==='reset')navigate(()=>{const url=new URL(location.href);url.searchParams.set('variant',state.variant);url.searchParams.set('page',state.page);location.href=url.href;location.reload();});
 else if(action==='about')showDialog('about-dialog',`<div class="dialog-title"><h2 id="about-title">比较哪种方式更省力</h2><button type="button" class="icon-button" data-action="close-about" aria-label="关闭说明">${icon('close')}</button></div><p><strong>A 先学后查</strong><br><span class="muted">练习先出现，词表按需展开；个人页先看目标。</span></p><p><strong>B 查学并行</strong><br><span class="muted">在词表与详情间快速切换；个人页先看学习变化。</span></p><p><strong>C 一步一页</strong><br><span class="muted">每次只做一件事，适合窄面板与手机。</span></p><p class="small muted">底部箭头或键盘左右键切换方案。顶部“单词 / 个人”切页。“状态”可以查看完整内存状态并切换空态场景。朗读仅演示反馈。所有内容都是合成示例，刷新还原。</p><div class="dialog-actions">${btn('开始体验','close-about','primary')}</div>`);
 else if(action==='close-about')closeDialog('about-dialog');
});
document.addEventListener('keydown',event=>{
 if(event.defaultPrevented||event.isComposing||event.ctrlKey||event.metaKey||event.altKey)return;
 if($('dialog[open]'))return;
 const target=event.target;
 if(target.closest('input,textarea,select,[contenteditable]'))return;
 if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();changeVariant(event.key==='ArrowRight'?1:-1);return;}
 if(target.closest('button,a,summary'))return;
 const visible=state.page==='words'&&!state.draft&&(state.variant==='A'||state.variant==='B'&&state.bPane==='study'||state.variant==='C'&&state.cView==='study');
 if(!visible)return;
 if(['1','2','3','4'].includes(event.key)){event.preventDefault();answer(Number(event.key)-1);}
 if(event.key==='Enter'&&roundAnswered()){event.preventDefault();state.round.index++;state.round.picked=null;render({keepListScroll:true});}
});
window.addEventListener('beforeunload',event=>{if(profileDirty()){event.preventDefault();event.returnValue='';}});
$$('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();}}));
render();console.info('Prototype initial state',visibleState());
</script>
</body>
</html>
